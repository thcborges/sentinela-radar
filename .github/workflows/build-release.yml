name: Release Build Pipeline - Sentinela

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar Dependências
        run: flutter pub get

      - name: Validação Estática e Testes Herméticos
        run: |
          flutter analyze --fatal-infos
          flutter test --coverage

      - name: Build Android App Bundle (Google Play)
        run: flutter build appbundle --release

      - name: Build Android Release APK (Universal e Split por ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Gerar Checksums SHA-256 dos Binários
        run: |
          mkdir -p build/release-checksums
          cd build/app/outputs
          find bundle flutter-apk -type f \( -name "*.aab" -o -name "*.apk" \) -exec sha256sum {} + > ../../release-checksums/SHA256SUMS.txt
          cd ../..

      - name: Upload Release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: sentinela-release-bundle
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload Release Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: sentinela-release-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Checksums SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: sentinela-release-checksums
          path: build/release-checksums/SHA256SUMS.txt

      - name: Publicar GitHub Release Oficial
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "Sentinela ${{ github.ref_name }} — Versão Oficial"
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/release-checksums/SHA256SUMS.txt
          generate_release_notes: true
