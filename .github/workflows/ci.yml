name: CI Pipeline - Sentinela

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-and-coverage:
    name: Testes BDD/TDD & Auditoria de Cobertura (>= 90%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar Dependências
        run: flutter pub get

      - name: Análise Estática de Código (flutter analyze)
        run: flutter analyze --fatal-infos

      - name: Executar Suíte de Testes BDD/TDD com Cobertura
        run: flutter test --coverage

      - name: Validar Barreira de Cobertura (>= 90%)
        run: |
          COVERAGE=$(awk -F: '/^DA:/ {split($2,a,","); lines++; if (a[2]>0) hit++} END {if (lines>0) printf "%.2f", (hit/lines)*100; else print "0"}' coverage/lcov.info)
          echo "Cobertura calculada: $COVERAGE%"
          awk -v cov="$COVERAGE" 'BEGIN {if (cov >= 90.0) {print "Cobertura OK (>= 90%)"; exit 0} else {print "Cobertura insuficiente (< 90%): " cov "%"; exit 1}}'

  security-scan:
    name: Análise de Segurança & Vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
