name: sentinela
description: Aplicativo offline de alerta antecipado de radares, semáforos, lombadas e pedágios.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  sqlite3: ^3.8.0
  http: ^1.6.0
  geolocator: ^14.0.1
  wakelock_plus: ^1.8.2
  connectivity_plus: ^7.3.2
  flutter_tts: ^4.2.5
  wakelock_plus_platform_interface: ^1.7.0
  connectivity_plus_platform_interface: ^2.1.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/
